# Five jobs, because they need five different things.
#
# `check` is the ordinary one: format, lints, docs, and the tests that need
# nothing installed. `engine` is the reason this crate left the tOS repository
# -- tOS's CI has no Chromium and is not going to grow one, and the tests in
# tests/engine.rs are worth nothing without a real engine behind them. `mac`
# is the same on macOS, which has code of its own (shared memory without
# /dev/shm, browsers in app bundles) that no Linux job runs. `msrv` holds the
# `rust-version` in Cargo.toml to something true. `tools` checks the
# proof-of-concept scripts, which are the other half of the repository and were
# until now the half nothing looked at.
name: CI

# `push` is narrowed to main on purpose. With a bare `push:` every commit on a
# branch with a pull request open ran the workflow twice -- once for the push
# to `refs/heads/<branch>` and once for `refs/pull/<n>/merge` -- and the two
# runs are not even the same commit: the pull_request one tests the merge with
# main, which is the one worth having. Two engine jobs at two and a half
# minutes each, to answer a question once.
#
# Nothing stops being checked. A branch is covered by its pull request, and
# main is covered here, which is what makes the record on main a record of
# what actually landed rather than of what was proposed.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The default token can write to the repository. Nothing in this workflow
# needs to: it reads the checkout and reports a status, and a job that cannot
# push is a job that cannot be talked into pushing.
permissions:
  contents: read

# A branch that is pushed twice in a minute does not need the first run
# finished. `main` is excluded: those runs are the record of what the branch
# did, and cancelling one leaves a commit nobody ever tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: fmt, clippy, docs, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # --locked everywhere, on purpose. Every dependency here is a git
      # revision, so Cargo.lock is the only thing recording which tree of tOS
      # was built; without it cargo is free to re-resolve and quietly test
      # something other than what is committed. It also makes a stale lock file
      # a failure rather than a diff that appears in the next person's branch.
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The lint table in Cargo.toml is the same set a laptop gets; -D warnings
      # is what CI adds on top.
      #
      # This crate is mostly prose -- the module documentation carries the
      # measurements and the reasoning that the code assumes -- and it is full
      # of intra-doc links. Nothing checked them until this line: a `[`motion`]`
      # that stopped resolving rendered as literal brackets and no build noticed.
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # Without BLINKTERM_ENGINE every test in tests/engine.rs skips itself and
      # says so, which is the point: this job proves the code compiles and the
      # unit tests pass, and makes no claim about the engine.
      - run: cargo test --locked

  msrv:
    name: builds on the oldest Rust it claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Read the floor out of Cargo.toml rather than repeating it here. Two
      # copies of a version number is one copy that goes stale, and this job
      # exists because the declared floor had already gone stale once: it said
      # 1.75 for a tree that has never built below 1.87.
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "no rust-version in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: |
          rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
          rustup default ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # `check`, not `test`: this job is about whether the compiler accepts the
      # tree, and whether the program works is `check`'s and `engine`'s
      # business on a toolchain that can run them faster.
      - run: cargo check --all-targets --locked
      # The macOS-only code (`cfg(not(target_os = "linux"))` in graphics.rs
      # and engine.rs) is compiled by no Linux job; this checks it on the
      # floor too. A `check` needs no SDK -- nothing is linked -- and it was
      # what showed the tree compiles for a Mac before there was a Mac job.
      - run: rustup target add aarch64-apple-darwin
      - run: cargo check --target aarch64-apple-darwin --all-targets --locked
      # The README tells people which Rust to install, and it said 1.75 for as
      # long as Cargo.toml did. Fixing one and not the other is the same bug
      # again, so every "Rust <x>.<y>" in the README has to be this job's
      # version. Cheap, and it runs next to the thing it is comparing against.
      - name: The README agrees about the floor
        run: |
          version=${{ steps.msrv.outputs.version }}
          bad=0
          for found in $(grep -oE 'Rust \*{0,2}[0-9]+\.[0-9]+' README.md \
                         | grep -oE '[0-9]+\.[0-9]+' | sort -u); do
            if [ "$found" != "$version" ]; then
              echo "README.md says Rust $found; Cargo.toml says $version" >&2
              bad=1
            fi
          done
          exit $bad

  tools:
    name: shell and python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # run.sh already carries a `# shellcheck disable=SC2086` on the line that
      # splits $flags deliberately. That directive was written for a shellcheck
      # that never ran; this is it.
      #
      # --severity=warning, so this gates on warnings and errors and not on
      # info. The one info it drops is SC2329 "this function is never invoked"
      # for `cleanup`, which `trap 'cleanup' EXIT INT TERM` invokes -- through
      # a string shellcheck does not read.
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=warning tools/run.sh
      # E9 and F only: syntax errors and pyflakes -- undefined names, unused
      # imports, a broken f-string. Deliberately not ruff's style rules. These
      # are stdlib-only proof-of-concept scripts and some of what ruff would
      # object to is intended, `encode_frame_shm(counter=[0])` being the plain
      # case: a mutable default used as a counter, which is the idiom and not a
      # mistake. The gate is "does it still run", not "is it to ruff's taste".
      #
      # setup-python rather than the runner's own interpreter, because a
      # distribution Python is marked externally-managed (PEP 668) and refuses
      # a plain `pip install` into it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3"
      - name: ruff
        run: |
          python3 -m pip install --quiet ruff
          python3 -m ruff check --select E9,F tools/

  engine:
    name: engine tests, real Chromium
    runs-on: ubuntu-latest
    # bookworm because that is what the frames were measured on, and what a tOS
    # rootfs is. Running in a container rather than apt-getting onto the runner
    # keeps the engine a pinned Debian one instead of whatever the image ships.
    container:
      image: rust:1-bookworm
      # /dev/shm on a GitHub container is 64 MB by default. The `t=s` frames
      # are a few megabytes each and are unlinked as they are read, so 64 MB is
      # enough -- and running at the default is the point, since it is what
      # anybody else's container will have too.
    steps:
      - uses: actions/checkout@v7
      - name: Install the engine and the fonts
        # Chrome for Testing's chrome-headless-shell, pinned by version and by
        # checksum, and not Debian's chromium-shell, which this job used to
        # install on the belief that it was Debian's headless_shell. It is not:
        # it is Chromium's content_shell. Run against a real content_shell
        # build, the engine tests fail exactly as this job did on 153 --
        # content_shell starts its DevTools listener whether or not it is asked
        # to, so the engine keeps a TCP port open beside the pipe (#5); it
        # answers a page's alert, confirm and prompt itself before anybody can
        # (#7); it does not exit on Browser.close, so a profile is never
        # flushed (#6); and its error page is titled "Error" (#8). Against
        # chrome-headless-shell 141 and 153 all of them pass.
        #
        # The libraries are the ones `ldd` lists for the binary, by their
        # bookworm package names. The CJK fonts are not decoration: without
        # them a page of Japanese renders as boxes and the frames still look
        # fine to an assertion.
        env:
          SHELL_VERSION: 153.0.8010.52
          SHELL_SHA256: 944dc1eae654637fed4d57650198774f9c43b45f34e48febb84f43c541b5de76
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl unzip fonts-liberation fonts-noto-cjk \
            libasound2 libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libdbus-1-3 libdrm2 libexpat1 libgbm1 libglib2.0-0 libnspr4 \
            libnss3 libudev1 libx11-6 libxcb1 libxcomposite1 libxdamage1 \
            libxext6 libxfixes3 libxi6 libxkbcommon0 libxrandr2 libxrender1
          rm -rf /var/lib/apt/lists/*
          curl -fsSLo /tmp/shell.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/$SHELL_VERSION/linux64/chrome-headless-shell-linux64.zip"
          echo "$SHELL_SHA256  /tmp/shell.zip" | sha256sum -c -
          unzip -q /tmp/shell.zip -d /opt
          rm /tmp/shell.zip
          # Which engine this run tested against, in the log. The headless
          # shell answers --version as root with no --no-sandbox and no
          # --ozone-platform, unlike the chromium-shell this replaced -- it has
          # no X11 to reach for -- which this line's own runs have shown.
          /opt/chrome-headless-shell-linux64/chrome-headless-shell --version
      - uses: Swatinem/rust-cache@v2
      # --release because several of these tests assert on timings: the rest
      # interval before a still, the frame rate under a steady wheel, the cost
      # of a decode. A debug build misses them all.
      #
      # --test-threads=1 for the same reason. Each of these tests starts a
      # Chromium of its own, and a standard runner has two cores; four engines
      # painting at once makes the scroll tests measure the runner rather than
      # the program, and they say so -- a_steady_hand_moves_the_page_steadily
      # failed on a 3.6x swing between two frames on the first run of this
      # workflow. One at a time gives each engine the machine the numbers were
      # taken on, and the suite still finishes in half a minute.
      #
      # The job runs as root in the container, which the engine notices: it
      # adds --no-sandbox itself, because Chromium refuses to start as root
      # without it. See src/engine.rs.
      - run: cargo test --release --locked -- --test-threads=1
        env:
          BLINKTERM_ENGINE: /opt/chrome-headless-shell-linux64/chrome-headless-shell

  mac:
    name: macOS, clippy, test, engine tests
    # macos-15 is arm64 (M-series), like every Mac sold since 2020 and unlike
    # the x64 engine build, which is why the pinned shell below is mac-arm64.
    # Not fmt or doc: neither depends on the platform, and `check` runs them.
    # Clippy does, because the shared-memory store and the bundle search are
    # `cfg(not(target_os = "linux"))` and no Linux job compiles a line of
    # them -- `undocumented_unsafe_blocks` in particular only sees the
    # `unsafe` blocks that are built.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The unit tests, engine-less, in a debug build: the object-store round
      # trip and the name-length test are here and nowhere else. One at a
      # time, unlike `check`: on this three-core runner a parallel debug run
      # starved the scroll thread's timing test (18, then 11, of the 20 ticks
      # it needs in 420 ms), which measures the thread's schedule, not the
      # runner's load.
      - run: cargo test --locked -- --test-threads=1
      - name: Install the engine
        # Chrome for Testing's chrome-headless-shell for mac-arm64, the same
        # version the Linux job pins, by checksum. `curl` sets no quarantine
        # attribute, so Gatekeeper has no opinion about it. No apt: the
        # frameworks are in the zip and the fonts are the system's.
        env:
          SHELL_VERSION: 153.0.8010.52
          SHELL_SHA256: 47fe02eae3a1b6e9ba298c7a8aea4ca1be87741ef8fa2da55b8a6f76d636e894
        run: |
          curl -fsSLo "$RUNNER_TEMP/shell.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$SHELL_VERSION/mac-arm64/chrome-headless-shell-mac-arm64.zip"
          echo "$SHELL_SHA256  $RUNNER_TEMP/shell.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/shell.zip" -d "$RUNNER_TEMP/engine"
          rm "$RUNNER_TEMP/shell.zip"
          # Which engine this run tested against, in the log, as on Linux.
          "$RUNNER_TEMP/engine/chrome-headless-shell-mac-arm64/chrome-headless-shell" --version
      # --release and --test-threads=1 for the reasons the Linux job gives:
      # timing assertions, and one engine at a time on a three-core runner.
      - run: cargo test --release --locked -- --test-threads=1
        env:
          BLINKTERM_ENGINE: ${{ runner.temp }}/engine/chrome-headless-shell-mac-arm64/chrome-headless-shell
