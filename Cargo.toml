[package]
name = "blinkterm"
description = "A real browser in a terminal pane: headless Chromium over the Kitty graphics protocol"
version = "0.1.0"
edition = "2021"
# 1.87 is measured, not guessed: 1.86 does not build this tree and 1.87 does.
# The floor first came from the dependency closure -- `fontdue`, which the tOS
# crates pulled in, calls `integer_sign_cast` (stable in 1.87). `src/` then
# followed it: clippy gates its suggestions on this number, and once it read
# 1.87 it asked for `is_multiple_of` (1.87) and `repeat_n` (1.82). The tOS
# crates are gone and `fontdue` with them, and the floor is `src/`'s own now:
# base64.rs, screen.rs, inflate.rs and jpeg.rs call `is_multiple_of`.
#
# This said 1.75 until it was checked, which is what an unchecked number does.
# The `msrv` job in .github/workflows/ci.yml reads this line and builds against
# exactly it, so lowering it is now a thing CI has an opinion about.
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/m96-chan/blinkterm"
keywords = ["browser", "terminal", "kitty", "chromium", "cli"]
categories = ["command-line-utilities", "web-programming"]
# The package is the program. The tests stay in the repository: they parse
# this program's output with a copy of tOS's terminal in `vendor/`, which is
# not published, so they would not build from the package anyway.
include = ["/src/**/*.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[[bin]]
name = "blinkterm"
path = "src/main.rs"

[lib]
name = "blinkterm"
path = "src/lib.rs"

# One dependency, and it is `libc`. The PNG and JPEG decoders, inflate, the
# tty helpers and the cell arithmetic used to come from tOS as git revisions;
# they live in `src/` now (`png.rs`, `jpeg.rs`, `inflate.rs`, `tty.rs`,
# `fit.rs`), copied from tOS `c7677bde`. This program runs on a Mac and in
# Kitty, not only in a tOS pane, and a crate that crates.io will take cannot
# have a git dependency, so the code it runs is code it owns. A fix in tOS is
# now a fix to carry over by hand, and the other way round.
[dependencies]
libc = "0.2"

[dev-dependencies]
# The terminal the tests parse this program's output with: tOS's `tos-term`,
# copied into `vendor/` at the same revision and not published. It is a path
# with no version, so `cargo publish` leaves it out of the published manifest,
# and the tests that use it are the repository's rather than the package's.
tos-term = { path = "vendor/tos-term" }

# Not a member: a frozen copy is held to tOS's lints, not to this crate's,
# and `cargo clippy` here treats it as the outside code it is.
[workspace]
exclude = ["vendor/tos-term"]

# Copied from tOS's workspace profile, and `panic = "abort"` is the part that
# matters: `engine.rs` kills the engine's process group from a panic hook
# because `Drop` does not run on an abort, and `screen.rs` puts the terminal
# back the same way. Both were written against this setting; turning it off
# would leave them looking redundant and leave a stray Chromium behind.
[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

# The standard lives here rather than only in the CI invocation, so that
# `cargo clippy` on a laptop and `cargo clippy` in the workflow are the same
# command with the same answer. CI adds `-D warnings` on top; locally these
# stay warnings so a work in progress still builds.
[lints.rust]
# The signal handling, the termios and the process groups are all `libc`, and
# an FFI declaration that disagrees with the header is the kind of mistake that
# survives every test and then corrupts a struct. These catch a few of them.
improper_ctypes = "warn"
improper_ctypes_definitions = "warn"
# `unsafe` inside an `unsafe fn` is still `unsafe`; edition 2024 makes this the
# default and this crate already writes it that way.
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
# The reason this table exists. There are 63 `unsafe` blocks in `src/` (counted
# as `grep -o 'unsafe {' src/*.rs | wc -l`, so the tests' among them), nearly
# all of them one-line `libc` calls, and every one says what makes it sound. A
# crate that explains a 150 ms rest interval at four paragraphs should not be
# asking anyone to take a `kill(2)` on faith.
undocumented_unsafe_blocks = "warn"
# Cheap, and none of them has ever had a false positive here: a `todo!` or a
# stray `dbg!` reaching main is a mistake every time.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "warn"
empty_loop = "warn"
