# Only the actions, and deliberately only the actions.
#
# The workflow pins actions/checkout, actions/setup-python, Swatinem/rust-cache
# by major tag. Those tags move under us, and when one is retired the job stops
# with a message about an unsupported version rather than anything to do with
# this program. A monthly pull request is the cheapest way to hear about that
# from Dependabot instead of from a red build on an unrelated branch.
#
# The `Homebrew` workflow pins `Homebrew/actions/setup-homebrew` by commit
# instead, with the dated tag in a comment, since that repository has no
# major-version tag to follow. Dependabot moves a commit pin the same way, and
# the entry below already covers every workflow file.
#
# There is no `cargo` entry on purpose. The one dependency is `libc`, at
# `0.2`: a monthly pull request moving a patch release of it in Cargo.lock is
# noise, and `cargo update` does the same when somebody wants it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
